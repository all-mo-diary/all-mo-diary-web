<!doctype html>
<!-- 由 demo/tools/build.py 從正式版的 admin.html 產生，不要手改。 -->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <script src="storage-shim.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only this site, the diary backend and Google sign-in may run or be contacted; no inline script. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://router-backend-3hl2.onrender.com">
  <meta name="robots" content="noindex">
  <title>管理後台 - 全心日記</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="console">
  <header class="top">
    <a href="index.html"><img src="../favicon.png" alt="回首頁"></a>
    <span class="title">管理後台</span>
    <span id="who" class="muted"></span>
    <button id="logout" hidden>登出</button>
  </header>
  <main>
    <div id="status" class="card" hidden><p id="status-msg" class="muted"></p></div>
    <div id="app" hidden>
      <div class="tabs" id="tabs">
        <button data-tab="fonts" class="active">字體</button>
        <button data-tab="version">App 版本</button>
        <button data-tab="feedback">意見回饋</button>
        <button data-tab="admins">管理員</button>
        <button data-tab="audit">操作紀錄</button>
        <button data-tab="system">系統</button>
      </div>
      <div id="msg"></div>
      <section id="tab-fonts"></section>
      <section id="tab-version" hidden></section>
      <section id="tab-feedback" hidden></section>
      <section id="tab-admins" hidden></section>
      <section id="tab-audit" hidden></section>
      <section id="tab-system" hidden></section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="fixtures.js"></script>
  <script src="api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
